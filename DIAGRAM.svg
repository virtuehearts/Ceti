<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 z" fill="#5b6b7f"/>
  </marker>
  <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 z" fill="#35d07f"/>
  </marker>
  <style>
    text { font-family: monospace; fill: #d7dee8; }
    .t { font-size: 15px; font-weight: bold; }
    .s { font-size: 12px; fill: #8b98a9; }
    .lbl { font-size: 11px; fill: #5b6b7f; }
    .box { fill: #11161d; stroke: #2a3441; stroke-width: 1.5; rx: 6; }
  </style>
</defs>
<rect width="1400" height="1090" fill="#0b0f14"/>

<text x="700" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#35d07f">THE BRAIN — Jero's intellect, running on his iron</text>

<!-- Band A: query -> decide -->
<rect x="80" y="80" width="160" height="60" class="box"/>
<text x="160" y="116" text-anchor="middle" class="t">QUERY</text>
<line x1="240" y1="110" x2="292" y2="110" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="80" width="280" height="60" class="box" stroke="#35d07f"/>
<text x="440" y="106" text-anchor="middle" class="t">DECIDE</text>
<text x="440" y="128" text-anchor="middle" class="s">intent router · relevance classifier</text>

<!-- distribution bus -->
<line x1="700" y1="140" x2="700" y2="175" stroke="#5b6b7f" stroke-width="2"/>
<line x1="200" y1="175" x2="1160" y2="175" stroke="#5b6b7f" stroke-width="2"/>
<line x1="200" y1="175" x2="200" y2="196" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<line x1="520" y1="175" x2="520" y2="196" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<line x1="840" y1="175" x2="840" y2="196" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1160" y1="175" x2="1160" y2="196" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<text x="700" y="168" text-anchor="middle" class="lbl">tries in order</text>

<!-- Band B: tiers -->
<rect x="60" y="200" width="280" height="110" class="box" stroke="#35d07f"/>
<text x="200" y="228" text-anchor="middle" class="t">1 · AIML</text>
<text x="200" y="252" text-anchor="middle" class="s">cassettes · ~0ms</text>
<text x="200" y="272" text-anchor="middle" class="s">typo + paraphrase tolerant</text>

<line x1="340" y1="255" x2="372" y2="255" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<text x="356" y="246" text-anchor="middle" class="lbl">miss</text>

<rect x="380" y="200" width="280" height="110" class="box" stroke="#35d07f"/>
<text x="520" y="228" text-anchor="middle" class="t">2 · MEMORY</text>
<text x="520" y="252" text-anchor="middle" class="s">vector 768d · embeddinggemma-2</text>
<text x="520" y="272" text-anchor="middle" class="s">sqlite TF-IDF fallback</text>

<line x1="660" y1="255" x2="692" y2="255" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<text x="676" y="246" text-anchor="middle" class="lbl">miss</text>

<rect x="700" y="200" width="280" height="110" class="box" stroke="#4da3ff"/>
<text x="840" y="228" text-anchor="middle" class="t">3 · LOCAL QWEN</text>
<text x="840" y="252" text-anchor="middle" class="s">qwen2.5-coder:1.5b · Ollama</text>
<text x="840" y="272" text-anchor="middle" class="s">raw query — never leaves the box</text>

<line x1="980" y1="255" x2="1012" y2="255" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<text x="996" y="246" text-anchor="middle" class="lbl">miss</text>

<rect x="1020" y="200" width="280" height="110" class="box" stroke="#ffb224"/>
<text x="1160" y="228" text-anchor="middle" class="t">4 · CLOUD ORACLE</text>
<text x="1160" y="252" text-anchor="middle" class="s">OpenRouter / Nvidia</text>
<text x="1160" y="272" text-anchor="middle" class="s">PII-stripped query only</text>

<!-- Band C: learning loop -->
<line x1="840" y1="310" x2="330" y2="376" stroke="#5b6b7f" stroke-width="1.5"/>
<line x1="1160" y1="310" x2="400" y2="376" stroke="#5b6b7f" stroke-width="1.5"/>
<text x="730" y="352" text-anchor="middle" class="lbl">fresh answers</text>

<rect x="60" y="380" width="380" height="90" class="box" stroke="#35d07f"/>
<text x="250" y="408" text-anchor="middle" class="t">RELEVANCE CLASSIFIER</text>
<text x="250" y="432" text-anchor="middle" class="s">≥0.65 promote · 0.45–0.65 adjudicate</text>
<text x="250" y="450" text-anchor="middle" class="s">below: discard</text>

<line x1="440" y1="425" x2="492" y2="425" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="380" width="220" height="90" class="box"/>
<text x="610" y="412" text-anchor="middle" class="t">learned.aiml</text>
<text x="610" y="436" text-anchor="middle" class="s">Alice-style · capped 500</text>

<line x1="720" y1="425" x2="782" y2="425" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="790" y="380" width="260" height="90" class="box"/>
<text x="920" y="412" text-anchor="middle" class="t">knowledge.sqlite3</text>
<text x="920" y="436" text-anchor="middle" class="s">Q&amp;A + vectors + aliases</text>

<line x1="610" y1="380" x2="210" y2="314" stroke="#35d07f" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrg)"/>
<line x1="920" y1="380" x2="530" y2="314" stroke="#35d07f" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrg)"/>
<text x="400" y="336" text-anchor="middle" class="lbl" fill="#35d07f">feeds</text>
<text x="740" y="336" text-anchor="middle" class="lbl" fill="#35d07f">feeds</text>

<!-- Band D left: idle researcher -->
<rect x="60" y="540" width="600" height="250" class="box"/>
<text x="360" y="570" text-anchor="middle" class="t" fill="#35d07f">IDLE RESEARCHER — when the box is idle</text>

<rect x="80" y="600" width="125" height="70" class="box"/>
<text x="142" y="628" text-anchor="middle" class="t" font-size="13">topics.txt</text>
<text x="142" y="650" text-anchor="middle" class="s">12 queued</text>
<line x1="205" y1="635" x2="221" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="225" y="600" width="125" height="70" class="box"/>
<text x="287" y="628" text-anchor="middle" class="t" font-size="13">research</text>
<text x="287" y="650" text-anchor="middle" class="s">5 engines</text>
<line x1="350" y1="635" x2="366" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="370" y="600" width="125" height="70" class="box"/>
<text x="432" y="628" text-anchor="middle" class="t" font-size="13">distill</text>
<text x="432" y="650" text-anchor="middle" class="s">local Qwen</text>
<line x1="495" y1="635" x2="511" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="515" y="600" width="125" height="70" class="box"/>
<text x="577" y="628" text-anchor="middle" class="t" font-size="13">cassette</text>
<text x="577" y="650" text-anchor="middle" class="s">+ vector DB</text>

<text x="360" y="716" text-anchor="middle" class="s">idle cycles pre-train the cassettes, Wikipedia-style</text>
<text x="360" y="740" text-anchor="middle" class="s">classify → keep only what earns its place</text>

<!-- Band D right: signed sets -->
<rect x="740" y="540" width="600" height="250" class="box"/>
<text x="1040" y="570" text-anchor="middle" class="t" fill="#ffb224">SIGNED SETS → SEED</text>

<rect x="760" y="600" width="80" height="70" class="box"/>
<text x="800" y="640" text-anchor="middle" class="t" font-size="13">hash</text>
<line x1="840" y1="635" x2="849" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="853" y="600" width="80" height="70" class="box"/>
<text x="893" y="640" text-anchor="middle" class="t" font-size="13">chain</text>
<line x1="933" y1="635" x2="942" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="946" y="600" width="80" height="70" class="box"/>
<text x="986" y="640" text-anchor="middle" class="t" font-size="13">sign</text>
<line x1="1026" y1="635" x2="1035" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1039" y="600" width="80" height="70" class="box"/>
<text x="1079" y="640" text-anchor="middle" class="t" font-size="13">gzip</text>
<line x1="1119" y1="635" x2="1128" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1132" y="600" width="80" height="70" class="box"/>
<text x="1172" y="640" text-anchor="middle" class="t" font-size="12">torrent</text>
<line x1="1212" y1="635" x2="1221" y2="635" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1225" y="600" width="80" height="70" class="box"/>
<text x="1265" y="640" text-anchor="middle" class="t" font-size="13">seed</text>

<text x="1040" y="716" text-anchor="middle" class="s">regula_core ECDSA · merkle root · chained ledger</text>
<text x="1040" y="740" text-anchor="middle" class="s">no signature, no seed — peers trust math, not seeders</text>

<!-- Band E: agent -->
<rect x="60" y="815" width="1280" height="170" class="box"/>
<text x="700" y="843" text-anchor="middle" class="t" fill="#4da3ff">AGENT — CETI: a name, tasks, loops, schedules</text>

<rect x="80" y="865" width="150" height="80" class="box"/>
<text x="155" y="893" text-anchor="middle" class="t" font-size="13">tasks.db</text>
<text x="155" y="915" text-anchor="middle" class="s">+ gaps log</text>
<text x="155" y="933" text-anchor="middle" class="s">schedules</text>
<line x1="230" y1="905" x2="258" y2="905" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="262" y="865" width="110" height="80" class="box" stroke="#4da3ff"/>
<text x="317" y="910" text-anchor="middle" class="t" font-size="14">tick()</text>
<line x1="372" y1="905" x2="400" y2="905" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="404" y="865" width="100" height="80" class="box"/>
<text x="454" y="905" text-anchor="middle" class="t" font-size="12">research</text>
<rect x="516" y="865" width="100" height="80" class="box"/>
<text x="566" y="905" text-anchor="middle" class="t" font-size="12">benchmark</text>
<rect x="628" y="865" width="100" height="80" class="box"/>
<text x="678" y="905" text-anchor="middle" class="t" font-size="12">curiosity</text>
<rect x="740" y="865" width="100" height="80" class="box"/>
<text x="790" y="905" text-anchor="middle" class="t" font-size="12">ingest</text>
<rect x="852" y="865" width="100" height="80" class="box"/>
<text x="902" y="905" text-anchor="middle" class="t" font-size="12">release</text>
<line x1="952" y1="905" x2="980" y2="905" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arr)"/>

<rect x="984" y="865" width="200" height="80" class="box" stroke="#ffb224"/>
<text x="1084" y="893" text-anchor="middle" class="t" font-size="13">datasets</text>
<text x="1084" y="915" text-anchor="middle" class="s">verified · signed</text>
<text x="1084" y="933" text-anchor="middle" class="s">shipped</text>

<text x="700" y="972" text-anchor="middle" class="s">the self-learning sentence: exams itself, notices gaps, goes and learns them, ships them.</text>

<!-- footer -->
<text x="700" y="1025" text-anchor="middle" font-size="18" font-weight="bold" fill="#35d07f">LLMs are handlers. The datasets are the mind.</text>
<text x="700" y="1052" text-anchor="middle" class="s">Persona: Jero as Khan — commanding, certain, theatrical. Wrath at problems, never people.</text>
<text x="700" y="1075" text-anchor="middle" class="lbl">stdlib only · Jero-node class hardware</text>
</svg>
